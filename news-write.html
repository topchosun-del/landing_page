<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <title>게시글 작성/수정 - 평강부동산 관리자</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
    @layer base {
      html, body { width: 100%; margin: 0; padding: 0; min-height: 100vh; }
      body { overscroll-behavior-y: none; background-color: #f2f4f6; }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
    }
    ::-webkit-scrollbar { display: none; }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#0059b9",
            "primary-hover": "#2272eb",
            "foreground": "#191f28",
            "body": "#4e5968",
            "muted": "#8b95a1",
            "surface": "#f2f4f6",
            "surface-alt": "#e8f3ff",
            "canvas": "#ffffff",
            "border": "#e5e8eb",
            "danger": "#e42939"
          },
          fontFamily: {
            sans: ["Plus Jakarta Sans", "sans-serif"]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-surface font-sans text-body flex flex-col min-h-screen">
  <header class="fixed top-0 w-full z-50 pt-safe bg-canvas/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
    <div class="h-16 px-4 md:px-8 max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="admin.html" class="min-w-[44px] min-h-[44px] flex items-center justify-center text-foreground hover:text-primary transition-colors">
          <span class="material-symbols-outlined text-[24px]">arrow_back</span>
        </a>
        <h1 id="page-heading" class="text-base md:text-lg font-bold text-foreground">새 글 작성</h1>
      </div>
      <div class="flex items-center gap-2">
        <button id="btn-save" class="h-10 px-5 rounded-xl bg-primary hover:bg-primary-hover text-white text-xs md:text-sm font-semibold flex items-center gap-1.5 transition-all active:scale-[0.98]">
          <span class="material-symbols-outlined text-[18px]">check</span>
          <span>저장하기</span>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 flex flex-col w-full pt-16 pb-32 bg-surface">
    <div class="max-w-4xl mx-auto w-full px-4 md:px-6 pt-5">
      <form id="write-form" class="bg-canvas rounded-2xl p-5 md:p-8 shadow-sm flex flex-col gap-4">
        <div>
          <label for="post-title-input" class="block text-xs font-bold text-foreground mb-1.5">제목</label>
          <input id="post-title-input" required class="w-full h-12 px-4 rounded-xl bg-surface text-sm md:text-base text-foreground placeholder:text-muted focus:outline-none focus:bg-canvas focus:ring-1 focus:ring-primary border border-transparent focus:border-primary transition-all" placeholder="게시글 제목을 입력하세요" type="text">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="post-category-select" class="block text-xs font-bold text-foreground mb-1.5">카테고리</label>
            <select id="post-category-select" class="w-full h-12 px-3.5 rounded-xl bg-surface text-sm text-foreground focus:outline-none focus:bg-canvas focus:ring-1 focus:ring-primary border border-transparent focus:border-primary transition-all">
              <option value="분양·청약">분양·청약</option>
              <option value="LH">LH</option>
              <option value="원투쓰리룸">원투쓰리룸</option>
              <option value="재건축·개발">재건축·개발</option>
              <option value="안심상식">안심상식</option>
              <option value="상가정보">상가정보</option>
              <option value="일반">일반</option>
            </select>
          </div>
          <div>
            <label for="post-date-input" class="block text-xs font-bold text-foreground mb-1.5">작성일</label>
            <input id="post-date-input" required class="w-full h-12 px-4 rounded-xl bg-surface text-sm text-foreground focus:outline-none focus:bg-canvas focus:ring-1 focus:ring-primary border border-transparent focus:border-primary transition-all" type="date">
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="post-content-input" class="text-xs font-bold text-foreground">본문 내용 (마크다운 지원)</label>
            <span class="text-xs text-muted"># 제목, **굵게**, - 목록, > 인용구 지원</span>
          </div>
          <textarea id="post-content-input" required rows="14" class="w-full p-4 rounded-xl bg-surface text-sm font-sans text-foreground placeholder:text-muted focus:outline-none focus:bg-canvas focus:ring-1 focus:ring-primary border border-transparent focus:border-primary transition-all leading-relaxed" placeholder="여기에 본문 내용을 작성하세요. 마크다운 형식(#, **, -, > 등)이 지원됩니다."></textarea>
        </div>

        <div id="status-msg" class="hidden p-3 rounded-xl text-xs font-medium"></div>
      </form>
    </div>
  </main>

  <script src="db.js"></script>
  <script>
    requireAdmin();

    const urlParams = new URLSearchParams(window.location.search);
    const editId = urlParams.get('id');

    const headingEl = document.getElementById('page-heading');
    const titleInput = document.getElementById('post-title-input');
    const categorySelect = document.getElementById('post-category-select');
    const dateInput = document.getElementById('post-date-input');
    const contentInput = document.getElementById('post-content-input');
    const btnSave = document.getElementById('btn-save');
    const statusMsg = document.getElementById('status-msg');

    dateInput.value = new Date().toISOString().split('T')[0];

    async function initForm() {
      if (!editId) return;
      headingEl.textContent = '게시글 수정';
      document.title = '게시글 수정 - 평강부동산 관리자';

      try {
        const post = await getPost(editId);
        if (post) {
          titleInput.value = post.title || '';
          categorySelect.value = post.category || '일반';
          dateInput.value = post.date || '';
          contentInput.value = post.content || '';
        } else {
          alert('게시글을 찾을 수 없습니다.');
          location.href = 'admin.html';
        }
      } catch(e) {
        alert('게시글 로드 실패: ' + e.message);
      }
    }

    btnSave.addEventListener('click', async () => {
      const title = titleInput.value.trim();
      const category = categorySelect.value;
      const date = dateInput.value;
      const content = contentInput.value.trim();

      if (!title) {
        alert('제목을 입력해 주세요.');
        titleInput.focus();
        return;
      }
      if (!content) {
        alert('내용을 입력해 주세요.');
        contentInput.focus();
        return;
      }

      btnSave.disabled = true;
      btnSave.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span> <span>저장 중...</span>';
      statusMsg.className = 'p-3 rounded-xl text-xs font-medium bg-surface text-body';
      statusMsg.textContent = 'GitHub 및 로컬 저장소에 동기화 중입니다...';
      statusMsg.classList.remove('hidden');

      try {
        if (editId) {
          await updatePost(editId, { title, category, date, content });
        } else {
          await addPost({ title, category, date, content });
        }
        statusMsg.className = 'p-3 rounded-xl text-xs font-medium bg-surface-alt text-primary';
        statusMsg.textContent = '✓ 게시글이 성공적으로 저장되었습니다!';
        setTimeout(() => {
          location.href = editId ? `news-detail.html?id=${encodeURIComponent(editId)}` : 'admin.html';
        }, 600);
      } catch(e) {
        statusMsg.className = 'p-3 rounded-xl text-xs font-medium bg-red-100 text-danger';
        statusMsg.textContent = '저장 실패: ' + e.message;
        btnSave.disabled = false;
        btnSave.innerHTML = '<span class="material-symbols-outlined text-[18px]">check</span> <span>저장하기</span>';
      }
    });

    window.addEventListener('DOMContentLoaded', initForm);
  </script>
</body>
</html>
