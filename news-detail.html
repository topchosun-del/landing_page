  <script src="db.js"></script>
  <script>
    async function initDetail() {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');
      const loadingEl = document.getElementById('post-loading');
      const articleEl = document.getElementById('post-article');

      if (!id) {
        loadingEl.textContent = '게시글 ID가 유효하지 않습니다.';
        return;
      }

      try {
        const post = await getPost(id);
        if (!post) {
          loadingEl.textContent = '존재하지 않거나 삭제된 게시글입니다.';
          return;
        }

        document.title = `${post.title} - 평강부동산`;
        document.getElementById('post-category').textContent = post.category || '소식';
        document.getElementById('post-date').textContent = post.date || '';
        document.getElementById('post-title').textContent = post.title || '제목 없음';
        
        const contentEl = document.getElementById('post-content');
        contentEl.innerHTML = renderMarkdown(post.content || '');

        if (isAdmin()) {
          const actionsEl = document.getElementById('admin-actions');
          actionsEl.classList.remove('hidden');
          actionsEl.classList.add('flex');

          document.getElementById('btn-edit').addEventListener('click', () => {
            window.location.href = `news-write.html?id=${encodeURIComponent(post.id)}`;
          });

          document.getElementById('btn-delete').addEventListener('click', async () => {
            if (confirm('정말 이 게시글을 삭제하시겠습니까?')) {
              try {
                await deletePost(post.id);
                alert('게시글이 삭제되었습니다.');
                window.location.href = 'news.html';
              } catch(e) {
                alert('삭제 중 오류가 발생했습니다: ' + e.message);
              }
            }
          });
        }

        loadingEl.classList.add('hidden');
        articleEl.classList.remove('hidden');
      } catch(e) {
        loadingEl.textContent = '게시글을 불러오는 중 오류가 발생했습니다.';
      }
    }

    window.addEventListener('DOMContentLoaded', initDetail);
  </script>
